[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "civictrace"
version = "0.0.1"
description = "Local, reproducible public-interest investigative analytics foundation"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5", "pyarrow==23.0.1", "duckdb==1.4.3"]
snapshots = ["pyarrow==23.0.1"]
analytics = ["pyarrow==23.0.1", "duckdb==1.4.3"]
data = ["duckdb==1.4.3", "polars>=1.20,<3", "pydantic>=2.10,<3"]

[project.scripts]
civictrace = "civictrace.cli:main"
civictrace-snapshot = "civictrace.snapshots:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
