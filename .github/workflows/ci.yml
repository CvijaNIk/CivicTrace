name: Foundation CI
on:
  push:
    branches: [main, foundation/civictrace]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/check_docs.py
      - name: Reproduce synthetic demo
        run: |
          civictrace examples/synthetic_procurement.json --collected-at 2026-10-10T00:00:00Z --output /tmp/findings-a.json
          civictrace examples/synthetic_procurement.json --collected-at 2026-10-10T00:00:00Z --output /tmp/findings-b.json
          cmp /tmp/findings-a.json /tmp/findings-b.json
